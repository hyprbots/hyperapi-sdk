[build-system]
# Exact pin: the release job builds with --no-isolation from the hash-locked
# .github/build-requirements.txt, so this must equal the setuptools locked there.
# setuptools builds wheels itself; the separate `wheel` package is not needed.
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperapi-sdk"
version = "0.7.1"
description = "HyperAPI Python SDK - Document intelligence APIs (parse, extract, classify, split, redact)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "HyperAPI", email = "research@hyperbots.com"}
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["ocr", "document-processing", "invoice", "financial", "api"]
dependencies = [
    "httpx>=0.28.1,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.20.0",
    "ruff==0.8.6",
    "pre-commit>=4.0.0",
]
socks = [
    "httpx[socks]>=0.28.1,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
# asyncio_mode = "auto" lets async test functions run without per-test
# @pytest.mark.asyncio decorators — every `async def test_*` is collected.
asyncio_mode = "auto"
# The contract tests talk to a mocked http://test.local; the plain-http warning
# is covered by tests/test_base_url.py (pytest.warns still sees it).
filterwarnings = ["ignore:base_url .* uses plain http:UserWarning"]

[project.urls]
Homepage = "https://apis.hyperbots.com"
Documentation = "https://apis.hyperbots.com/docs"
Repository = "https://github.com/hyprbots/hyperapi-sdk"
Issues = "https://github.com/hyprbots/hyperapi-sdk/issues"
Changelog = "https://github.com/hyprbots/hyperapi-sdk/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["hyperapi*"]

[tool.setuptools.package-data]
hyperapi = ["py.typed"]
