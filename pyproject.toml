[build-system]
# A range, not an exact pin: source installs (`pip install -e .`, building the
# sdist) must work on every supported Python, and current setuptools needs 3.10+.
# The release itself is built with --no-isolation from the hash-locked
# .github/build-requirements.txt, so that file decides which setuptools builds
# the published wheel. setuptools builds wheels itself; `wheel` is not needed.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperapi-sdk"
version = "0.8.0"
description = "HyperAPI Python SDK - Document intelligence APIs (parse, extract, classify, split, redact)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "HyperAPI", email = "research@hyperbots.com"}
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["ocr", "document-processing", "invoice", "financial", "api"]
dependencies = [
    "httpx>=0.28.1,<1.0",
    "pydantic>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.20.0",
    "ruff==0.8.6",
    "pre-commit>=4.0.0",
]
# Regenerates hyperapi/types/_generated.py from openapi/hyperapi-public.yaml.
codegen = [
    "datamodel-code-generator==0.92.0",
    "ruff==0.8.6",  # formats the generated file; a different ruff changes the output
]
socks = [
    "httpx[socks]>=0.28.1,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Models (generated, and _sdk.py) keep Optional[...]/Union[...]: pydantic evaluates annotations
# at runtime, and `X | Y` does not evaluate on Python 3.9.
"hyperapi/types/_generated.py" = ["UP007"]
"hyperapi/types/_sdk.py" = ["UP007"]

[tool.pytest.ini_options]
# asyncio_mode = "auto" lets async test functions run without per-test
# @pytest.mark.asyncio decorators — every `async def test_*` is collected.
asyncio_mode = "auto"
# The contract tests talk to a mocked http://test.local; the plain-http warning
# is covered by tests/test_base_url.py (pytest.warns still sees it).
filterwarnings = ["ignore:base_url .* uses plain http:UserWarning"]

[project.urls]
Homepage = "https://apis.hyperbots.com"
Documentation = "https://apis.hyperbots.com/docs"
Repository = "https://github.com/hyprbots/hyperapi-sdk"
Issues = "https://github.com/hyprbots/hyperapi-sdk/issues"
Changelog = "https://github.com/hyprbots/hyperapi-sdk/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["hyperapi*"]

[tool.setuptools.package-data]
hyperapi = ["py.typed"]
