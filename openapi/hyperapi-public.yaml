      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/DocumentAsset'
        fonts:
          type: array
          items:
            $ref: '#/components/schemas/DocumentAsset'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentAsset'
    DocumentAsset:
      type: object
      additionalProperties: true
      properties:
        part:
          type: string
          description: Part name inside the package.
        url:
          type: string
          description: Presigned GET; absent if the upload or signing failed.
    ExtractResponse:
      type: object
      additionalProperties: true
      description: Sync response and async job body for /v1/extract and /v1/extract-omni.
      required:
      - status
      - request_id
      - task
      - model_used
      - cached
      - result
      - ocr_text
      - duration_ms
      - metadata
      properties:
        status:
          type: string
          const: success
        request_id:
          type: string
        task:
          type: string
          enum:
          - extract
          - extract-omni
        model_used:
          type: string
        cached:
          type: boolean
        result:
          anyOf:
          - $ref: '#/components/schemas/ExtractEntitiesResult'
          - $ref: '#/components/schemas/ExtractTemplateResult'
        ocr_text:
          type: string
        duration_ms:
          type: integer
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
        dashboard_url:
          type: string
    ExtractEntitiesResult:
      type: object
      additionalProperties: true
      description: 'Extracted fields: `entities`, `line_items` and `summary`. If part of an extraction
        fails, its fields are null.'
      required:
      - entities
      - line_items
      - summary
      properties:
        entities:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Header/party fields; keys depend on the document.
        line_items:
          type:
          - array
          - 'null'
          items:
            type: object
            additionalProperties: true
        summary:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Document-level fields (totals, tax, currency, document_type …); keys depend on
            the document.
        partial:
          type: boolean
          const: true
          description: Present only when one leg failed.
        leg_errors:
          type: object
          additionalProperties:
            type: string
          description: Present only with `partial` — failed leg name to exception type name.
    ExtractTemplateResult:
      type: object
      additionalProperties: true
      description: 'A template was filled in: the caller''s `schema`, or the organization''s stored template.'
      required:
      - data
      - summary
      properties:
        data:
          description: The template, filled in (same shape as the template).
        summary:
          type: object
          additionalProperties: true
    ClassifyResponse:
      type: object
      additionalProperties: true
      description: Reply of /v1/classify (sync, or a completed classify job).
      required:
      - status
      - request_id
      - task
      - model_used
      - cached
      - result
      - ocr_text
      - duration_ms
      - metadata
      properties:
        status:
          type: string
          const: success
        request_id:
          type: string
        task:
          type: string
          const: classify
        model_used:
          type: string
        cached:
          type: boolean
        result:
          $ref: '#/components/schemas/ClassifyResult'
        ocr_text:
          type: string
        duration_ms:
          type: integer
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
        dashboard_url:
          type: string
    ClassifyResult:
      type: object
      additionalProperties: true
      description: The classification result.
      required:
      - document_type
      - initial_label
      - early_exit
      - early_exit_reason
      - domain
      - status
      - raw_label
      - other_hint
      - subject_hint
      - confidence
      - needs_review
      - rejection
      - warnings
      properties:
        document_type:
          type:
          - string
          - 'null'
        initial_label:
          type:
          - string
          - 'null'
        early_exit:
          type: boolean
          description: True when the document was rejected.
        early_exit_reason:
          type: string
        domain:
          type: string
          enum:
          - financial
          - non_financial
        status:
          type:
          - string
          - 'null'
          description: Classifier outcome (e.g. `rejected`).
        raw_label:
          type:
          - string
          - 'null'
        other_hint:
          type:
          - string
          - 'null'
        subject_hint:
          type:
          - string
          - 'null'
        confidence:
          type:
          - number
          - 'null'
        needs_review:
          type:
          - boolean
          - 'null'
        rejection:
          type:
          - object
          - 'null'
          additionalProperties: true
        warnings:
          type:
          - array
          - 'null'
