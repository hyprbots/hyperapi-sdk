      - status
      - request_id
      - task
      - model_used
      - cached
      - result
      - duration_ms
      - metadata
      properties:
        status:
          type: string
          const: success
        request_id:
          type: string
        task:
          type: string
          const: redact
        model_used:
          type: string
        cached:
          type: boolean
        result:
          $ref: '#/components/schemas/RedactResult'
        duration_ms:
          type: integer
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
        dashboard_url:
          type: string
    RedactResult:
