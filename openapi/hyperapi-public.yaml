      - status
      - request_id
      - task
      - model_used
      - cached
      - result
      - ocr_text
      - duration_ms
      - metadata
      properties:
        status:
          type: string
          const: success
        request_id:
          type: string
        task:
          type: string
          const: split
        model_used:
          type: string
        cached:
          type: boolean
        result:
          anyOf:
          - $ref: '#/components/schemas/SplitResult'
          - $ref: '#/components/schemas/SplitNotRequired'
        ocr_text:
          type: string
        duration_ms:
          type: integer
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
        dashboard_url:
          type: string
    SplitResult:
      type: object
      additionalProperties: true
