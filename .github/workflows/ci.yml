name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only token. Actions are pinned to full commit SHAs (tag in the comment).
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and L1 contract tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check hyperapi/
      - name: Test (mocked contract suite)
        run: pytest tests/ -v --tb=short --cov=hyperapi --cov-report=term --cov-report=xml
      - name: Enforce coverage threshold
        if: matrix.python == '3.12'
        run: pytest tests/ --cov=hyperapi --cov-fail-under=80 -q
      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-xml
          path: coverage.xml

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Audit runtime dependencies
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install --quiet .
          pip install --quiet "pip-audit==2.10.1"
          pip-audit --path "$(/tmp/audit/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
