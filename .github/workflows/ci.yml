name: CI

on:
  push:
    branches:
      - main
      - production
      - preproduction
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality-gates:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check hyperapi/
      - name: Test
        run: pytest tests/ -v --tb=short
