name: Release

# Builds and publishes the SDK to PyPI when a tag matching `v*` is pushed.
#
# This workflow uses **PyPI Trusted Publishers (OIDC)**: no API token in repo
# secrets, no long-lived credentials anywhere. The PyPI publisher entry names
# this repo, this workflow file and the `release` environment.
#
# Hardening:
# - Workflow-level permissions are empty. Each job asks only for what it needs.
# - Only the `publish` job can mint an OIDC token (`id-token: write`). It runs no
#   repo code and installs nothing: it downloads the built files and uploads them.
# - Every action is pinned to a full commit SHA (the tag is in the comment).
# - No caches are used anywhere in this workflow.
# - The `release` environment requires a reviewer and accepts only `v*` tags.

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  test:
    name: Test on Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check hyperapi/
      - name: Test
        run: pytest tests/ -v --tb=short

  build:
    name: Build wheel + sdist
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install build tools (hash-locked)
        # build, setuptools and their dependencies, each pinned by hash. With
        # --no-isolation below, this setuptools is the one that builds the wheel.
        run: pip install --require-hashes --no-deps -r .github/build-requirements.txt

      - name: Verify tag matches package version
        run: |
          # Read versions without importing the package: its runtime deps
          # (httpx) are not installed in this job.
          TAG="${GITHUB_REF##*/}"
          PYPROJECT="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          INIT="v$(python -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("hyperapi/__init__.py").read()).group(1))')"
          if [ "$TAG" != "$PYPROJECT" ] || [ "$TAG" != "$INIT" ]; then
            echo "::error::Tag $TAG, pyproject $PYPROJECT and __init__ $INIT must all match"
            exit 1
          fi

      - name: Build wheel + sdist
        run: python -m build --no-isolation

      - name: Upload built files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          retention-days: 90

  publish:
    name: Publish to PyPI (OIDC)
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: release
      url: https://pypi.org/project/hyperapi-sdk/
    permissions:
      id-token: write   # PyPI Trusted Publishers (OIDC); this job only
    steps:
      - name: Download built files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        # No `password:`: Trusted Publishers handle auth via OIDC. PEP 740
        # attestations are on by default and cover the exact files built above.
