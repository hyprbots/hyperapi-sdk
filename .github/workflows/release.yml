name: Release

# Builds and publishes the SDK to PyPI when a tag matching `v*` is pushed.
#
# This workflow uses **PyPI Trusted Publishers (OIDC)** — no API token in repo
# secrets, no long-lived credentials anywhere. The maintainer must register the
# binding once at https://pypi.org/manage/account/publishing/ for this repo +
# the `release` environment configured below.
#
# Tag protection on `v*` is recommended (Settings → Tags → Protected tags) so
# only repo admins can cut releases.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # required for PyPI Trusted Publishers (OIDC)

jobs:
  test:
    name: Test on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check hyperapi/
      - name: Test
        run: pytest tests/ -v --tb=short

  build-and-publish:
    name: Build wheel + sdist, publish via OIDC
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: release
      url: https://pypi.org/project/hyperapi-sdk/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip install build twine

      - name: Verify tag matches package version
        run: |
          # Read versions without importing the package: its runtime deps
          # (httpx) are not installed in this job.
          TAG="${GITHUB_REF##*/}"
          PYPROJECT="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          INIT="v$(python -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("hyperapi/__init__.py").read()).group(1))')"
          if [ "$TAG" != "$PYPROJECT" ] || [ "$TAG" != "$INIT" ]; then
            echo "::error::Tag $TAG, pyproject $PYPROJECT and __init__ $INIT must all match"
            exit 1
          fi

      - name: Build wheel + sdist
        run: python -m build

      - name: Validate metadata + README rendering
        run: twine check dist/*

      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` — Trusted Publishers handle the auth via OIDC.

      - name: Upload built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 90
